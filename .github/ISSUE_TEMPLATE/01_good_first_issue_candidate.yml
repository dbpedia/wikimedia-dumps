name: Good First Issue Candidate Template
description: Propose a potential Good First Issue (candidate)
title: "[Good First Issue]:"
labels: ["Good First Issue Candidate"]
assignees: []
body:
  - type: textarea
    id: intro-gfi-candidate
    attributes:
      label: ⚠️ Good First Issue — Candidate
      value: |
        > This issue is not yet a confirmed Good First Issue.
        > It is being evaluated for suitability and may require
        > clarification or refinement before it is ready to be picked up.
        > 
        > Please wait for maintainer confirmation before starting work.
        >
        > Maintainers and reviewers can read more about Good First Issues:
        > Documentation/custom_publish.md

    validations:
      required: false

  - type: textarea
    id: intro
    attributes:
      label: 🆕🐥 First Timers Only
      description: Who is this issue for?
      value: |
        This issue is reserved for people who have never contributed or have made minimal contributions to [DBpedia Wikimedia Dumps](https://www.dbpedia.org).
        We know that creating a pull request (PR) is a major barrier for new contributors.
        The goal of this issue and all other issues in [**find a good first issue**](https://github.com/issues?q=is%3Aopen+is%3Aissue+org%3Adbpedia+archived%3Afalse+label%3A%22good+first+issue%22+) is to help you make your first contribution to the DBpedia Wikimedia Dumps project.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > ### 📋 Good First Issue (GFI) Guidelines
        > A Good First Issue generally has a narrow scope and clear instructions, with examples or solution provided.
        >        
        > Examples of acceptable GFI work include:
        >
        > - **Very small, explicitly defined changes to crawler or publisher**  
        >   *(rare and mechanical only — not behavior-changing)*, such as:
        >   - Adding or fixing `__str__` or `__repr__` methods **when the exact output is specified**
        >   - Fully specified typing fixes (e.g. adding a known return type)
        > - **Refactors of existing code** that are purely structural:
        >   - Splitting a large function into smaller functions
        >   - Extracting constants or config values  
        >   *(when explicitly instructed)*
        > - **Documentation improvements** that are instruction-driven:
        >   - Fixing known typos or grammar issues
        >   - Renaming variables when new names are provided
        >   - Making explicitly requested changes to docstrings, comments, or print statements
        > - **Functional improvements to existing scripts**  
        >   *(only when the additional steps are explicitly described)*
        > - **Small, clearly specified edits to existing tests**
        >   - Adding a known assertion to an existing test file
        >
        > **What we do NOT consider Good First Issues:**
        >
        > - Writing new documentation, examples, or tests
        > - Any change that requires deciding *what* to do or *how* something should behave
        > - Changes to core crawling or publishing logic
        > - Changes to Databus API integration or SPARQL queries
        > - Work spanning multiple files, modules, or subsystems
        > - Tasks requiring domain or architectural knowledge
        >
        >
        > 📖 *For a more detailed explanation, refer to:  
        > [`Documentation/custom_publish.md`](Documentation/custom_publish.md).*

  - type: textarea
    id: issue
    attributes:
      label: 👾 Description of the issue
      description: |
        DESCRIBE THE ISSUE IN A WAY THAT IS UNDERSTANDABLE TO NEW CONTRIBUTORS.
        YOU MUST NOT ASSUME THAT SUCH CONTRIBUTORS HAVE ANY KNOWLEDGE ABOUT THE LANGUAGE, CODEBASE OR DBPEDIA.
        IT IS HELPFUL TO ADD LINKS TO THE RELEVANT DOCUMENTATION AND/OR CODE SECTIONS.
        BELOW IS AN EXAMPLE.
      value: |
        Edit here. Example provided below.

    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        <!-- Example for problem (hidden in submission) -->
        ## 👾 Description of the issue - Example

        The `wiki_dumps_crawler.py` currently uses hardcoded file extensions in the `skip_extensions` list to filter out non-HTML URLs. These extensions are defined inline in the script, making it harder to maintain or configure.

        For example:
        ```python

        # File extensions to skip
        skip_extensions = [".bz2", ".xml", ".sql", ".gz", ".zip", ".tar", ".7z"]

        def should_skip(url):
            return any(url.lower().endswith(ext) for ext in skip_extensions)

        async def fetch_and_parse(session, url):
            try:
                async with session.get(url, timeout=10) as response:
                    if response.status != 200:
                        print(f"Failed {url} - Status {response.status}")
                        return []

                    content_type = response.headers.get('Content-Type', '')
                    if 'text/html' not in content_type:
                        print(f"Non-HTML content skipped: {url}")
                        return []

                    successful_urls.add(url)

                    html = await response.text()
                    soup = BeautifulSoup(html, "html.parser")
                    links = []

                    for tag in soup.find_all("a", href=True):
                        href = tag["href"]
                        if href.startswith("#") or href.startswith(".."):
                            continue

                        next_url = urljoin(url, href)
                        parsed = urlparse(next_url)

                        if parsed.netloc != base_domain or should_skip(next_url):
                            continue

                        if next_url not in visited_urls:
                            links.append(next_url)
            except Exception as e:
                print(f"Error crawling {url}: {e}")
                return []
        ```

  - type: textarea
    id: solution
    attributes:
      label: 💡 Proposed Solution
      description: |
        AT THIS SECTION YOU NEED TO DESCRIBE THE STEPS NEEDED TO SOLVE THE ISSUE.
        PLEASE BREAK DOWN THE STEPS AS MUCH AS POSSIBLE AND MAKE SURE THAT THEY
        ARE EASY TO FOLLOW. IF POSSIBLE, ADD LINKS TO THE RELEVANT
        DOCUMENTATION AND/OR CODE SECTIONS.
      value: |
        Edit here. Example provided below.

    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        <!-- Example for the solution (hidden in submission) -->
        ## 💡 Solution - Example

        The solution is to extract the `skip_extensions` list and `should_skip()` logic into a configurable constant or configuration section at the top of the file, and optionally allow loading from an external config.
        Such as:
        - Move `skip_extensions` to a clearly documented `CONFIGURATION` section
        - Add docstrings explaining why each extension is skipped
        - Consider making extension filtering case-insensitive

  - type: textarea
    id: implementation
    attributes:
      label: 👩‍💻 Implementation Steps
      description: |
        AT THIS SECTION YOU NEED TO DESCRIBE THE TECHNICAL STEPS NEEDED TO SOLVE THE ISSUE.
        PLEASE BREAK DOWN THE STEPS AS MUCH AS POSSIBLE AND MAKE SURE THAT THEY ARE EASY TO FOLLOW.
        IF POSSIBLE, ADD LINKS TO THE RELEVANT DOCUMENTATION AND/OR CODE.
      value: |
        Edit here. Example provided below.

    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        <!-- Example implementation (hidden in submission) -->
        ### 👩‍💻 Implementation - Example

        To extract and improve the URL filtering configuration:
        - [ ] Identify the `skip_extensions` list in `wiki_dumps_crawler.py`
        - [ ] Move it to a clearly labeled `# === CONFIGURATION ===` section at the top of the file
        - [ ] Add a docstring or comment explaining the purpose of each extension
        - [ ] Ensure `should_skip()` still works correctly with the moved list
        - [ ] Run the crawler and verify the same URLs are crawled as before

        For example:
        ```python

        # === CONFIGURATION ===
        # File extensions to skip during crawling.
        # These are binary dump files that should not be parsed as HTML.
        SKIP_EXTENSIONS = [
            ".bz2",   # Bzip2 compressed dumps
            ".xml",   # XML data dumps
            ".sql",   # SQL database dumps
            ".gz",    # Gzip compressed files
            ".zip",   # ZIP archives
            ".tar",   # Tar archives
            ".7z",    # 7-Zip archives
        ]

        def should_skip(url: str) -> bool:
            """Check if a URL points to a binary dump file that should be skipped."""
            return any(url.lower().endswith(ext) for ext in SKIP_EXTENSIONS)
        ```

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: ✅ Acceptance Criteria
      description: |
        EDIT OR EXPAND THE CHECKLIST ON WHAT IS REQUIRED TO BE ABLE TO MERGE A PULL REQUEST FOR THIS ISSUE
      value: |
        To be able to merge a pull request for this issue, we need:

        - [ ] **Assignment:** get assigned by commenting `/assign` [see guide](https://github.com/dbpedia/wikimedia-dumps/blob/main/Documentation/SETUP.md)
        - [ ] **Changelog Entry:** Correct changelog entry [see guide](https://github.com/dbpedia/wikimedia-dumps/blob/main/CHANGELOG.md)
        - [ ] **Signed commits:** commits must be DCO and GPG key signed [see guide](https://github.com/dbpedia/wikimedia-dumps/blob/main/Documentation/SETUP.md)
        - [ ] **All Tests Pass:** our workflow checks must pass
        - [ ] **Issue is Solved:** The implementation fully addresses the issue requirements as described above
        - [ ] **No Further Changes are Made:** Code review feedback has been addressed and no further changes are requested
    validations:
      required: true

  - type: textarea
    id: contribution_steps
    attributes:
      label: 📋 Step-by-Step Contribution Guide
      description: Provide a contribution workflow suitable for new contributors
      value: |
        If you have never contributed to an open source project at GitHub, the following step-by-step guide will introduce you to the workflow.

        - [ ] **Assignment:** get assigned by commenting `/assign` [see guide](https://github.com/dbpedia/wikimedia-dumps/blob/main/Documentation/SETUP.md)
        - [ ] **Fork, Branch and Work on the issue:** Create a copy of the repository, create a branch for the issue and solve the problem. For instructions, please read our [Contributing guide](https://github.com/dbpedia/wikimedia-dumps/blob/main/CONTRIBUTING.md) file. Further help can be found at [Setup Documentation](https://github.com/dbpedia/wikimedia-dumps/tree/main/Documentation).
        - [ ] **DCO and GPG key sign each commit :** each commit must be -s and -S signed. An explanation on how to do this is at [Setup Guide](https://github.com/dbpedia/wikimedia-dumps/blob/main/Documentation/SETUP.md)
        - [ ] **Add a Changelog Entry :** your pull request will require a changelog. See [CHANGELOG.md](https://github.com/dbpedia/wikimedia-dumps/blob/main/CHANGELOG.md) to learn how.
        - [ ] **Push and Create a Pull Request :** Once your issue is resolved, and your commits are signed, and you have a changelog entry, push your changes and create a pull request.
        - [ ] **You did it 🎉:** A maintainer or committer will review your pull request and provide feedback. If approved, we will merge the fix in the main branch. Thanks for being part of the DBpedia community as an open-source contributor ❤️

        ***IMPORTANT*** You will ONLY be assigned to the issue if you comment: `/assign`
        ***IMPORTANT*** Your pull request CANNOT BE MERGED until you add a changelog entry AND sign your commits each with `git commit -S -s -m "chore: your commit message"` with a GPG key setup.
    validations:
      required: true

  - type: textarea
    id: information
    attributes:
      label: 🤔 Additional Information
      description: Provide any extra resources or context for contributors to solve this good first issue
      value: |
        For more help, we have extensive documentation:
        - [Project Documentation](https://github.com/dbpedia/wikimedia-dumps/tree/main/Documentation)
        - [Setup Guide](https://github.com/dbpedia/wikimedia-dumps/blob/main/Documentation/SETUP.md)

        Additionally, we invite you to join our community on the [DBpedia Forum](https://forum.dbpedia.org).

        We also invite you to attend our [DBpedia Community Meetings](https://forum.dbpedia.org). The meetings are for hands-on-help and general community discussion.

        You can also ask for help in a comment below!
