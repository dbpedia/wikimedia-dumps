name: Beginner Issue Template
description: Create a Beginner Issue for fairly new contributors
title: "[Beginner]: "
labels: ["beginner"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ---
        ## **Thanks for contributing!** 😊

        We truly appreciate your time and effort. If this is your first open-source contribution, welcome!
        This template is designed to help you create a Beginner-friendly issue: an easy, well-scoped task that helps fairly new contributors learn the codebase and build their skills.
        ---
  - type: textarea
    id: intro
    attributes:
      label: 🐥 Beginner Friendly
      description: Who is this issue for?
      value: |
        This issue is intended for contributors who have previously completed a Good First Issue in [DBpedia](https://www.dbpedia.org) and are at a beginner level.
        We recognize that gaining confidence and building skills are equally important steps in the open-source contributor journey.
        The purpose of this issue—and others listed under [**Find a beginner issue**](https://github.com/dbpedia/wikimedia-dumps/issues?q=is%3Aissue%20state%3Aopen%20label%3Abeginner%20no%3Aassignee)—is to provide a supportive, low-pressure environment where you can learn, practice, and grow your contribution skills with confidence.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > ### 🐥 Beginner Issue Guidelines
        >
        > Beginner Issues are intended for contributors who are familiar with the project workflow and have **some programming experience** and are wanting opportunities to build skills.
        > These issues may require **light investigation, interpretation of existing code, and some self-initiative**, but should remain **well-scoped with a clear intent**.
        >
        > **What we generally consider beginner issues:**
        >
        > - **Small, well-scoped updates to existing tests**:
        >   - Adjusting or extending an existing test to cover a simple case
        > - **Narrow changes or additions to crawler or publisher functionality** using common Python skills, such as:
        >   - Implementing or refining `__str__` methods
        >   - Implementing or refining `__repr__` methods
        >   - Typing improvements, such as return type hints or basic type conflicts
        > - **Documentation improvements** such as creating new docstrings for existing functions or improving README
        > - **Functional improvements to existing scripts**:
        >   - Adding logging or progress indicators to better demonstrate functionality
        >
        > **What we generally do NOT consider beginner issues:**
        > - Tasks better suited for Good First Issues (purely mechanical or fully guided changes)
        > - Creating entirely new scripts or test suites
        > - Changes to core Databus API integration or SPARQL query logic
        > - Work that requires deep knowledge across multiple areas of the codebase

        > 📖 *For a more detailed explanation, refer to:  
        > [`Documentation/custom_publish.md`](Documentation/custom_publish.md).*

  - type: textarea
    id: issue
    attributes:
      label: 👾 Description of the issue
      description: |
        DESCRIBE THE ISSUE IN A WAY THAT IS UNDERSTANDABLE AND APPROACHABLE TO BEGINNER CONTRIBUTORS.
        ASSUME SUCH CONTRIBUTORS HAVE AT MOST BEGINNER-LEVEL KNOWLEDGE ABOUT PROGRAMMING, THE CODEBASE AND DBPEDIA.
        IT IS HELPFUL TO ADD LINKS TO THE RELEVANT DOCUMENTATION AND/OR CODE SECTIONS.
        SLIGHTLY CHALLENGE THEM TO ENCOURAGE LEARNING AND RESEARCH BUT MAKE SURE THE ISSUE IS STILL SIMPLE.
        BELOW IS AN EXAMPLE.
      value: |
        Edit here. Example provided below.

    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        <!-- Example for problem (hidden in submission) -->
        ## 👾 Description of the issue - Example

        The `RateLimiter` class in `wikimedia_publish.py` handles rate-limiting for Databus API calls but currently lacks a `__repr__()` method, which makes it less helpful when debugging.

        For example, printing a `RateLimiter` instance in a REPL currently produces output similar to:

        ```python
        <__main__.RateLimiter object at 0x7f9c2a3b8d60>
        ```

        This makes it difficult to quickly identify the rate limiter's configuration during debugging sessions.

  - type: textarea
    id: solution
    attributes:
      label: 💡 Proposed Solution
      description: |
        AT THIS SECTION YOU NEED TO DESCRIBE THE STEPS NEEDED TO SOLVE THE ISSUE.
        PLEASE BREAK DOWN THE STEPS AS MUCH AS POSSIBLE AND MAKE SURE THAT THEY
        ARE EASY TO FOLLOW. IF POSSIBLE, ADD LINKS TO THE RELEVANT
        DOCUMENTATION AND/OR CODE SECTIONS.
      value: |
        Edit here. Example provided below.

    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        <!-- Example for the solution (hidden in submission) -->
        To improve this, we want to implement a more informative `__repr__()` method for the `RateLimiter` class that clearly displays its configuration.

        After this improvement, `repr(rate_limiter)` should return a clear and descriptive value that reflects
        the rate limiter's settings. For example:

        ```python
        RateLimiter(max_calls=5, period=1.0, remaining=3)
        ```

  - type: textarea
    id: implementation
    attributes:
      label: 👩‍💻 Implementation Steps
      description: |
        AT THIS SECTION YOU NEED TO DESCRIBE THE TECHNICAL STEPS NEEDED TO SOLVE THE ISSUE.
        PLEASE BREAK DOWN THE STEPS AS MUCH AS POSSIBLE AND MAKE SURE THAT THEY ARE EASY TO FOLLOW.
        IF POSSIBLE, ADD LINKS TO THE RELEVANT DOCUMENTATION AND/OR CODE.
      value: |
        Edit here. Example provided below.

    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        <!-- Example implementation (hidden in submission) -->
        ### 👩‍💻 Implementation - Example

        To implement this change, beginner contributors should:

        - [ ] Locate the `RateLimiter` class in `wikimedia_publish.py`
        - [ ] Review the existing `__init__()` method to understand the configuration fields (`max_calls`, `period`, etc.)
        - [ ] Review how `RateLimiter` is used throughout the publish script
        - [ ] Check whether other classes in the project implement `__repr__()` and follow a similar pattern
        - [ ] Implement or refine the `__repr__()` method so it:
          - Clearly displays the rate limiter's configuration values
          - Shows the current state (e.g., remaining calls)
          - Uses keyword-style formatting for readability
        - [ ] Test the new `__repr__()` method by running the publisher script

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: ✅ Acceptance Criteria
      description: |
        EDIT OR EXPAND THE CHECKLIST ON WHAT IS REQUIRED TO BE ABLE TO MERGE A PULL REQUEST FOR THIS ISSUE
      value: |
        To be able to merge a pull request for this issue, we need:
        - [ ] **Assignment:** You must be assigned to the issue, comment: `/assign` in the issue to get assigned [see guide](https://github.com/dbpedia/wikimedia-dumps/blob/main/Documentation/SETUP.md)
        - [ ] **Changelog Entry:** Correct changelog entry [see guide](https://github.com/dbpedia/wikimedia-dumps/blob/main/CHANGELOG.md)
        - [ ] **Signed commits:** commits must be DCO and GPG key signed [see guide](https://github.com/dbpedia/wikimedia-dumps/blob/main/Documentation/SETUP.md)
        - [ ] **All Tests Pass:** our workflow checks must pass
        - [ ] **Issue is Solved:** The implementation fully addresses the issue requirements as described above
        - [ ] **No Further Changes are Made:** Code review feedback has been addressed and no further changes are requested
    validations:
      required: true

  - type: textarea
    id: contribution_steps
    attributes:
      label: 📋 Step-by-Step Contribution Guide
      description: Provide a contribution workflow suitable for new contributors
      value: |
        - [ ] **Assignment:** You must be assigned to the issue, comment: `/assign` in the issue to get assigned [see guide](https://github.com/dbpedia/wikimedia-dumps/blob/main/Documentation/SETUP.md)
        - [ ] **Fork, Branch and Work on the issue:** Create a copy of the repository, create a branch for the issue and solve the problem. For instructions, please read our [Contributing guide](https://github.com/dbpedia/wikimedia-dumps/blob/main/CONTRIBUTING.md) file. Further help can be found at [Setup Documentation](https://github.com/dbpedia/wikimedia-dumps/tree/main/Documentation).
        - [ ] **DCO and GPG key sign each commit :** each commit must be -s and -S signed. An explanation on how to do this is at [Setup Guide](https://github.com/dbpedia/wikimedia-dumps/blob/main/Documentation/SETUP.md)
        - [ ] **Add a Changelog Entry :** your pull request will require a changelog. See [CHANGELOG.md](https://github.com/dbpedia/wikimedia-dumps/blob/main/CHANGELOG.md) to learn how.
        - [ ] **Push and Create a Pull Request :** Once your issue is resolved, and your commits are signed, and you have a changelog entry, push your changes and create a pull request.
        - [ ] **You did it 🎉:** A maintainer or committer will review your pull request and provide feedback. If approved, we will merge the fix in the main branch. Thanks for being part of the DBpedia community as an open-source contributor ❤️

        ***IMPORTANT*** You will ONLY be assigned to the issue if you comment: `/assign`
        ***IMPORTANT*** Your pull request CANNOT BE MERGED until you add a changelog entry AND sign your commits each with `git commit -S -s -m "chore: your commit message"` with a GPG key setup.
    validations:
      required: true

  - type: textarea
    id: information
    attributes:
      label: 🤔 Additional Information
      description: Provide any extra resources or context for contributors to solve this beginner issue
      value: |
        For more help, we have extensive documentation:
        - [Project Documentation](https://github.com/dbpedia/wikimedia-dumps/tree/main/Documentation)
        - [Setup Guide](https://github.com/dbpedia/wikimedia-dumps/blob/main/Documentation/SETUP.md)

        Additionally, we invite you to join our community on the [DBpedia Forum](https://forum.dbpedia.org).

        We also invite you to attend our [DBpedia Community Meetings](https://forum.dbpedia.org). The meetings are for hands-on-help and general community discussion.

        You can also ask for help in a comment below!
